name: macOS
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test routing, shortcuts, and geometry
        run: swift test
      - name: Build app bundle
        run: ./script/build_and_run.sh --build-only
      - uses: actions/upload-artifact@v4
        with:
          name: Yabaibye-macOS
          path: dist/Yabaibye.app
