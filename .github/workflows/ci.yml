name: macOS
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test release version and failure handling
        run: python3 -m unittest discover -s script/tests
      - name: Test routing, shortcuts, and geometry
        run: swift test
      - name: Build app bundle
        run: ./script/build_and_run.sh --build-only
      - name: Archive app with executable permissions
        run: ditto -c -k --sequesterRsrc --keepParent dist/Yabaibye.app dist/Yabaibye.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Yabaibye-macOS
          path: dist/Yabaibye.zip
